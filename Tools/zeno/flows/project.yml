name: ZenoFlows
options:
  bundleIdPrefix: com.local.zenoflows
  deploymentTarget:
    iOS: "17.0"
targets:
  FlowHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
  ZenoFlowTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FlowHost
    settings:
      TEST_TARGET_NAME: FlowHost
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
